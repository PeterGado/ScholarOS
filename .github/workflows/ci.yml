name: CI

# Runs the full backend and frontend test suites on every push/PR against main - catches a
# regression before it reaches production instead of relying on a human running pytest/npm
# test by hand before every deploy (2026-10-06, the project had zero CI before this).
# Deliberately verification-only for now: no deploy step. Wiring auto-deploy on top of this
# needs FLY_API_TOKEN/VERCEL_TOKEN added as GitHub repo secrets first - a separate decision
# from "run the tests," since it changes what merging to main actually does.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -q

  frontend:
    name: Frontend lint, build, and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Unit tests
        run: npm run test
