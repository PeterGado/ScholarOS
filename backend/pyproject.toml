[project]
name = "scholaros-backend"
version = "0.1.0"
description = "ScholarOS backend - modular monolith (ADR-003), FastAPI + Pydantic v2 (ADR-002)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "anyio>=4.8,<4.15",
    "python-multipart>=0.0.9",
    "bcrypt>=4.0",
    "google-genai>=1.0",
    "python-docx>=1.1",
    "pypdf>=6.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    "slowapi>=0.1.9",
    "google-auth>=2.35",
    "sentry-sdk[fastapi]>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "httpx2>=0.1",
    "moto[s3,server]>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
